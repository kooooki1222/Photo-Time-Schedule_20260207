<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Time Schedule - Kouki & Yuki</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; }
        h1, h2, h3, .serif { font-family: 'Noto Serif JP', serif; }
        
        @media print {
            @page { margin: 0; size: auto; }
            body { -webkit-print-color-adjust: exact; }
            .no-print { display: none !important; }
            .page-break { page-break-inside: avoid; }
        }
        /* アニメーション */
        .animate-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-700">
    <div id="root"></div>

    <!-- ReactとライブラリをES Modulesとして読み込み -->
    <script type="module">
        import React, { useState, useEffect } from "https://esm.sh/react@18.2.0";
        import ReactDOM from "https://esm.sh/react-dom@18.2.0/client";
        import { Camera, MapPin, Clock, Heart, Printer, Users, Sparkles, X, Loader2, Smile, Briefcase, GraduationCap } from "https://esm.sh/lucide-react@0.263.1";

        const PhotoSchedule = () => {
            // ▼▼▼ ここにAPIキーを入力してください ▼▼▼
            const GEMINI_API_KEY = ""; 
            // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

            // デザインテーマ定数（ハレクラニイメージ）
            const theme = {
                colors: {
                primary: '#7AB8CC', // Halekulani Blue / Orchid
                secondary: '#FDFBF7', // Sand / Off-white
                text: '#4A5568', // Dark Gray
                accent: '#D4AF37', // Gold for subtle accents
                groom: '#5B8FB9', // Muted Blue for Groom
                bride: '#D68C9F', // Muted Pink for Bride
                }
            };

            const scheduleData = [
                {
                id: 1,
                title: "SCENE 1",
                subtitle: "乾杯 〜 中座前",
                timeNote: "前半のメインフォトタイムです",
                groups: [
                    { order: 1, category: "SBC", side: "Bride", items: ["SBC辻堂", "SBC大宮東", "SBC全体"] },
                    { order: 2, category: "市立病院", side: "Bride", items: ["外科 (西3)", "外科 (6C)", "救急外来", "同期"] },
                    { order: 3, category: "大学", side: "Bride", items: ["大学"] },
                    { order: 4, category: "星野", side: "Mixed", items: ["新婦同級生", "新郎同級生", "野球部", "星野全体"] },
                ]
                },
                {
                id: 2,
                title: "SCENE 2",
                subtitle: "再入場後 〜 レク",
                timeNote: "お色直し後の華やかなショット",
                groups: [
                    { order: 5, category: "日揮 (Basrah/LNGC)", side: "Groom", items: ["Basrah", "LNGC"] },
                    { order: 6, category: "日揮 (G/K卓・野球部)", side: "Groom", items: ["G卓 (日揮先輩方)", "K卓 (CVL/STR)", "日揮野球部"] },
                    { order: 7, category: "日揮 (同期)", side: "Groom", items: ["Best Regards", "カーラボスコ"] },
                    { order: 8, category: "日揮 (全体)", side: "Groom", items: ["日揮全体"] },
                    { order: 9, category: "筑波", side: "Groom", items: ["筑波"] },
                    { order: 10, category: "中大", side: "Groom", items: ["少林寺", "研究室"] },
                    { order: 11, category: "バイト", side: "Groom", items: ["AEON", "湯けむり"] },
                ]
                },
                {
                id: 3,
                title: "SCENE 3",
                subtitle: "レク 〜 結び",
                timeNote: "パーティーのクライマックス",
                groups: [
                    { order: 12, category: "市立病院", side: "Bride", items: ["外科 (西3)", "外科 (6C)", "救急外来", "同期"] },
                    { order: 13, category: "SBC", side: "Bride", items: ["SBC辻堂", "SBC大宮東", "SBC全体"] },
                    { order: 14, category: "大学", side: "Bride", items: ["大学"] },
                    { order: 15, category: "星野", side: "Bride", items: ["新婦同級生"] },
                ]
                }
            ];

            // --- Gemini AI Integration State ---
            const [isAiModalOpen, setIsAiModalOpen] = useState(false);
            const [aiLoading, setAiLoading] = useState(false);
            const [aiResult, setAiResult] = useState("");
            const [selectedRelationship, setSelectedRelationship] = useState("");
            const [selectedVibe, setSelectedVibe] = useState("");

            const relationships = [
                { id: 'friends', label: '友人・同級生', icon: React.createElement(Users, { size: 18 }) },
                { id: 'work', label: '職場の皆様', icon: React.createElement(Briefcase, { size: 18 }) },
                { id: 'family', label: '親族・家族', icon: React.createElement(Heart, { size: 18 }) },
                { id: 'student', label: '学生時代', icon: React.createElement(GraduationCap, { size: 18 }) },
            ];

            const vibes = [
                { id: 'fun', label: '楽しく賑やかに', emoji: '😆' },
                { id: 'formal', label: 'きっちり正装で', emoji: '✨' },
                { id: 'emotional', label: 'エモく感動的に', emoji: '🥺' },
                { id: 'cool', label: 'カッコよく', emoji: '😎' },
            ];

            const generatePoseIdea = async () => {
                if (!selectedRelationship || !selectedVibe) return;
                
                // APIキーのチェック
                if (!GEMINI_API_KEY) {
                    setAiResult("⚠️ 管理者の方へ：index.htmlファイル内の `const GEMINI_API_KEY` にキーを設定してください。");
                    return;
                }

                setAiLoading(true);
                setAiResult("");

                const prompt = `
                あなたは結婚式のプロカメラマン兼ポージングアドバイザーです。
                「${selectedRelationship}」のグループが、「${selectedVibe}」雰囲気で新郎新婦と写真を撮ります。
                その場の全員がすぐに実践できる、具体的でユニークなポーズ案を3つ提案してください。
                
                出力形式:
                1. 【ポーズ名】説明
                2. 【ポーズ名】説明
                3. 【ポーズ名】説明
                
                ※説明は簡潔に、ユーモアを交えて日本語で書いてください。
                `;

                try {
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${GEMINI_API_KEY}`,
                    {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                    }),
                    }
                );

                const data = await response.json();
                
                if (data.error) {
                    console.error("API Error:", data.error);
                    setAiResult(`エラー: ${data.error.message || "API呼び出しに失敗しました"}`);
                } else {
                    const generatedText = data.candidates?.[0]?.content?.parts?.[0]?.text || "すみません、良いポーズが思いつきませんでした。もう一度試してください！";
                    setAiResult(generatedText);
                }
                } catch (error) {
                console.error("Error calling Gemini API:", error);
                setAiResult("エラーが発生しました。通信環境を確認してください。");
                } finally {
                setAiLoading(false);
                }
            };

            const handlePrint = () => {
                window.print();
            };

            return React.createElement("div", { className: "min-h-screen font-sans pb-12 relative", style: { backgroundColor: '#F9FAFB' } },
                // Header
                React.createElement("div", { className: "relative h-64 w-full overflow-hidden bg-white shadow-sm" },
                    React.createElement("div", { className: "absolute inset-0 opacity-20 bg-gradient-to-b from-blue-100 to-white" }),
                    React.createElement("svg", { className: "absolute bottom-0 w-full h-24 text-white fill-current", preserveAspectRatio: "none", viewBox: "0 0 1440 320" },
                        React.createElement("path", { fillOpacity: "1", d: "M0,160L80,170.7C160,181,320,203,480,202.7C640,203,800,181,960,165.3C1120,149,1280,139,1360,133.3L1440,128L1440,320L1360,320C1280,320,1120,320,960,320C800,320,640,320,480,320C320,320,160,320,80,320L0,320Z" })
                    ),
                    React.createElement("div", { className: "absolute inset-0 flex flex-col items-center justify-center p-6 text-center z-10" },
                        React.createElement("h2", { className: "text-xl md:text-2xl tracking-widest text-gray-500 mb-2 serif" }, "WEDDING RECEPTION"),
                        React.createElement("h1", { className: "text-4xl md:text-5xl serif text-gray-800 mb-4 tracking-wide" },
                            "Kouki ", React.createElement("span", { style: { color: theme.colors.primary } }, "&"), " Yuki"
                        ),
                        React.createElement("div", { className: "inline-flex items-center gap-2 px-6 py-2 bg-white/80 backdrop-blur-sm rounded-full shadow-sm border border-blue-100" },
                            React.createElement(Camera, { size: 18, style: { color: theme.colors.primary } }),
                            React.createElement("span", { className: "serif tracking-widest text-gray-600 font-bold" }, "PHOTO TIME SCHEDULE")
                        )
                    )
                ),

                // Main Content
                React.createElement("div", { className: "max-w-3xl mx-auto px-4 -mt-8 relative z-20" },
                    
                    // Info Card
                    React.createElement("div", { className: "bg-white rounded-xl shadow-lg p-6 mb-8 border-t-4", style: { borderColor: theme.colors.primary } },
                        React.createElement("div", { className: "flex flex-col md:flex-row items-center justify-between gap-4 text-center md:text-left" },
                            React.createElement("div", {},
                                React.createElement("p", { className: "text-gray-600 mb-1 text-sm" }, "皆様との記念写真を楽しみにしております"),
                                React.createElement("h3", { className: "text-lg font-bold text-gray-800" }, "グループごとに順番にお呼び出しいたします")
                            ),
                            React.createElement("div", { className: "flex flex-col items-center justify-center bg-blue-50 px-6 py-3 rounded-lg border border-blue-100 w-full md:w-auto" },
                                React.createElement("div", { className: "flex items-center gap-2 text-gray-500 text-xs uppercase tracking-wider mb-1" },
                                    React.createElement(MapPin, { size: 14 }),
                                    React.createElement("span", {}, "Location")
                                ),
                                React.createElement("p", { className: "font-bold text-gray-800 text-lg" }, "メインテーブル脇")
                            )
                        )
                    ),

                    // Schedule List
                    React.createElement("div", { className: "space-y-8" },
                        scheduleData.map((scene) => (
                            React.createElement("div", { key: scene.id, className: "page-break bg-white rounded-xl shadow-md overflow-hidden" },
                                // Section Header
                                React.createElement("div", { className: "p-4 md:p-6 text-white text-center relative overflow-hidden", style: { backgroundColor: theme.colors.primary } },
                                    React.createElement("div", { className: "absolute top-0 left-0 w-full h-full bg-white opacity-10 transform -skew-x-12" }),
                                    React.createElement("div", { className: "relative z-10" },
                                        React.createElement("div", { className: "flex items-center justify-center gap-2 mb-1 opacity-90" },
                                            React.createElement(Clock, { size: 16 }),
                                            React.createElement("span", { className: "text-sm font-medium uppercase tracking-widest" }, scene.subtitle)
                                        ),
                                        React.createElement("h3", { className: "text-2xl serif font-bold tracking-wider" }, scene.title),
                                        React.createElement("p", { className: "text-white/80 text-xs mt-1" }, scene.timeNote)
                                    )
                                ),
                                // Groups
                                React.createElement("div", { className: "p-2 md:p-6 divide-y divide-gray-100" },
                                    scene.groups.map((group, idx) => (
                                        React.createElement("div", { key: idx, className: "py-4 px-2 md:px-4 flex flex-col md:flex-row md:items-start gap-3 hover:bg-gray-50 transition-colors" },
                                            // Category & Order Badge & Side Badge
                                            React.createElement("div", { className: "md:w-1/3 flex flex-row md:flex-col items-center md:items-start justify-between md:justify-start gap-2" },
                                                // Group Name with Order Badge
                                                React.createElement("div", { className: "flex items-center gap-3" },
                                                    // Order Badge
                                                    React.createElement("div", { 
                                                        className: "flex items-center justify-center w-8 h-8 rounded-full bg-white text-gray-600 font-serif font-bold text-lg shadow-sm border border-gray-200 shrink-0",
                                                        title: "呼び出し順"
                                                    }, group.order),
                                                    // Category Name
                                                    React.createElement("span", { className: "font-bold text-gray-700 text-lg" }, group.category)
                                                ),
                                                
                                                // Side Badge (moved below or side)
                                                React.createElement("span", { className: `text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wide border md:ml-11 ${
                                                    group.side === 'Groom' 
                                                        ? 'bg-blue-50 text-blue-600 border-blue-100' 
                                                        : group.side === 'Bride'
                                                        ? 'bg-pink-50 text-pink-600 border-pink-100'
                                                        : 'bg-purple-50 text-purple-600 border-purple-100'
                                                }` },
                                                    group.side === 'Groom' ? "Groom's Side" : group.side === 'Bride' ? "Bride's Side" : "Kouki & Yuki"
                                                )
                                            ),
                                            // Items
                                            React.createElement("div", { className: "md:w-2/3 flex flex-wrap gap-2 mt-2 md:mt-0" },
                                                group.items.map((item, i) => (
                                                    React.createElement("div", { key: i, className: "flex items-center gap-2 bg-gray-50 border border-gray-100 rounded-lg px-3 py-2 w-full md:w-auto md:flex-1 min-w-[140px]" },
                                                        React.createElement(Users, { size: 14, className: "text-gray-400" }),
                                                        React.createElement("span", { className: "text-gray-700 font-medium" }, item)
                                                    )
                                                ))
                                            )
                                        )
                                    ))
                                )
                            )
                        ))
                    ),

                    // Footer
                    React.createElement("div", { className: "mt-12 mb-20 text-center text-gray-500 serif" },
                        React.createElement(Heart, { className: "mx-auto mb-4 text-pink-300", size: 24, fill: "#F9A8D4", style: { opacity: 0.6 } }),
                        React.createElement("p", { className: "text-sm tracking-widest uppercase mb-1" }, "Thank you for coming"),
                        React.createElement("p", { className: "text-xs opacity-60" }, "Please have your camera ready!")
                    )
                ),

                // AI Modal
                isAiModalOpen && React.createElement("div", { className: "fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm no-print" },
                    React.createElement("div", { className: "bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-in" },
                        // Modal Header
                        React.createElement("div", { className: "bg-gradient-to-r from-blue-100 to-purple-100 p-4 flex justify-between items-center border-b border-white/50" },
                            React.createElement("div", { className: "flex items-center gap-2" },
                                React.createElement(Sparkles, { className: "text-purple-500", size: 20 }),
                                React.createElement("h3", { className: "font-bold text-gray-800" }, "AIポーズ提案")
                            ),
                            React.createElement("button", { onClick: () => setIsAiModalOpen(false), className: "p-1 hover:bg-white/50 rounded-full transition-colors" },
                                React.createElement(X, { size: 20, className: "text-gray-500" })
                            )
                        ),
                        // Modal Content
                        React.createElement("div", { className: "p-6 max-h-[70vh] overflow-y-auto" },
                            !aiResult ? React.createElement(React.Fragment, null,
                                React.createElement("p", { className: "text-sm text-gray-500 mb-4" }, 
                                    "撮影の待ち時間に！", React.createElement("br"), "AIがグループにぴったりのポーズを提案します。"
                                ),
                                React.createElement("div", { className: "space-y-4" },
                                    // Relationship
                                    React.createElement("div", null,
                                        React.createElement("label", { className: "text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 block" }, "1. グループは？"),
                                        React.createElement("div", { className: "grid grid-cols-2 gap-2" },
                                            relationships.map((rel) => (
                                                React.createElement("button", {
                                                    key: rel.id,
                                                    onClick: () => setSelectedRelationship(rel.label),
                                                    className: `p-3 rounded-xl border flex items-center gap-2 text-sm transition-all ${
                                                        selectedRelationship === rel.label
                                                        ? 'bg-blue-50 border-blue-400 text-blue-700 ring-1 ring-blue-400'
                                                        : 'bg-gray-50 border-gray-100 text-gray-600 hover:bg-gray-100'
                                                    }`
                                                },
                                                    rel.icon,
                                                    rel.label
                                                )
                                            ))
                                        )
                                    ),
                                    // Vibe
                                    React.createElement("div", null,
                                        React.createElement("label", { className: "text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 block" }, "2. 雰囲気は？"),
                                        React.createElement("div", { className: "grid grid-cols-2 gap-2" },
                                            vibes.map((vibe) => (
                                                React.createElement("button", {
                                                    key: vibe.id,
                                                    onClick: () => setSelectedVibe(vibe.label),
                                                    className: `p-3 rounded-xl border flex items-center gap-2 text-sm transition-all ${
                                                        selectedVibe === vibe.label
                                                        ? 'bg-purple-50 border-purple-400 text-purple-700 ring-1 ring-purple-400'
                                                        : 'bg-gray-50 border-gray-100 text-gray-600 hover:bg-gray-100'
                                                    }`
                                                },
                                                    React.createElement("span", { className: "text-lg" }, vibe.emoji),
                                                    vibe.label
                                                )
                                            ))
                                        )
                                    ),
                                    // Submit
                                    React.createElement("button", {
                                        onClick: generatePoseIdea,
                                        disabled: !selectedRelationship || !selectedVibe || aiLoading,
                                        className: "w-full mt-4 bg-gradient-to-r from-blue-400 to-purple-400 text-white font-bold py-3 rounded-xl shadow-md hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 transition-all"
                                    },
                                        aiLoading ? React.createElement(Loader2, { className: "animate-spin" }) : React.createElement(Sparkles, { size: 18 }),
                                        aiLoading ? "AIが考え中..." : "ポーズを提案する！"
                                    )
                                )
                            ) : React.createElement("div", { className: "animate-in" },
                                React.createElement("div", { className: "bg-gradient-to-br from-yellow-50 to-orange-50 border border-orange-100 rounded-xl p-5 mb-4" },
                                    React.createElement("h4", { className: "font-bold text-orange-800 mb-3 flex items-center gap-2" },
                                        React.createElement(Smile, { size: 18 }), "おすすめポーズ"
                                    ),
                                    React.createElement("div", { className: "text-gray-700 text-sm leading-relaxed whitespace-pre-wrap font-medium" }, aiResult)
                                ),
                                React.createElement("button", {
                                    onClick: () => setAiResult(""),
                                    className: "w-full py-2 text-gray-500 text-sm hover:bg-gray-100 rounded-lg transition-colors"
                                }, "もう一度試す")
                            )
                        )
                    )
                ),

                // Floating Buttons
                React.createElement("div", { className: "fixed bottom-6 right-6 flex flex-col gap-3 no-print z-50 items-end" },
                     // AI Button
                     React.createElement("div", { className: "relative group" },
                         React.createElement("div", { className: "absolute right-full top-1/2 -translate-y-1/2 mr-3 bg-gray-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none" }, "AIポーズ提案"),
                         React.createElement("button", {
                             onClick: () => setIsAiModalOpen(true),
                             className: "bg-white text-purple-600 p-3 rounded-full shadow-lg hover:bg-purple-50 hover:shadow-xl hover:scale-105 transition-all border border-purple-100 flex items-center justify-center"
                         }, React.createElement(Sparkles, { size: 24, fill: "#E9D5FF" }))
                     ),
                    // Print Button
                    React.createElement("div", { className: "relative group" },
                         React.createElement("div", { className: "absolute right-full top-1/2 -translate-y-1/2 mr-3 bg-gray-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none" }, "印刷モード"),
                        React.createElement("button", {
                            onClick: handlePrint,
                            className: "bg-white text-gray-700 p-3 rounded-full shadow-lg hover:bg-gray-50 hover:shadow-xl hover:scale-105 transition-all border border-gray-200 flex items-center justify-center",
                            title: "このページを印刷"
                        }, React.createElement(Printer, { size: 24 }))
                    )
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(React.createElement(PhotoSchedule));
    </script>
</body>
</html>
